<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ "Create account" if mode == "register" else "Log in" }} | Adaptive Deadline Planner</title>
</head>
<body>
  <main>
    <h1>{{ "Create your account" if mode == "register" else "Welcome back" }}</h1>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <form method="post">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required minlength="8">
      <button type="submit">{{ "Create account" if mode == "register" else "Log in" }}</button>
    </form>
    <p>{{ "Already have an account?" if mode == "register" else "Need an account?" }}
      <a href="{{ url_for('auth.login' if mode == 'register' else 'auth.register') }}">{{ "Log in" if mode == "register" else "Register" }}</a>
    </p>
  </main>
</body>
</html>
