{% extends "base.html" %}

{% block title %}{{ 'Edit' if task_id else 'Add' }} task{% endblock %}

{% block content %}
<section class="form-card">
<h1>{{ 'Edit' if task_id else 'Add' }} task</h1>
{% if errors %}
<ul class="form-errors" role="alert">
  {% for message in errors.values() %}<li>{{ message }}</li>{% endfor %}
</ul>
{% endif %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
  <p><label for="name">Name</label><input id="name" name="name" value="{{ data.get('name', '') }}" maxlength="100" required></p>
  <p><label for="type">Type</label><select id="type" name="type">
    {% for type in task_types %}<option value="{{ type }}" {{ 'selected' if data.get('type') == type else '' }}>{{ type | capitalize }}</option>{% endfor %}
  </select></p>
  <p><label for="priority">Priority</label><select id="priority" name="priority">
    {% for priority in priorities %}<option value="{{ priority }}" {{ 'selected' if data.get('priority') == priority else '' }}>{{ priority | capitalize }}</option>{% endfor %}
  </select></p>
  <p><label for="deadline">Deadline</label><input id="deadline" type="date" name="deadline" value="{{ data.get('deadline', '') }}" min="{{ today }}" required></p>
  <p><label for="original_estimate">Original estimate (minutes)</label><input id="original_estimate" type="number" name="original_estimate" value="{{ data.get('original_estimate', '') }}" min="1" step="1" required></p>
  <div class="form-actions"><button type="submit">Save task</button>
  <a href="{{ url_for('tasks.list_tasks') }}">Cancel</a></div>
</form>
</section>
{% endblock %}
