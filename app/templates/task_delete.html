{% extends "base.html" %}

{% block title %}Delete task{% endblock %}

{% block content %}
<section class="form-card">
<h1>Delete task</h1>
<p>Delete <strong>{{ task.name }}</strong>?</p>
<p>This will also delete its work records and schedule entries. This cannot be undone.</p>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
  <div class="form-actions"><button class="btn btn-danger" type="submit" name="confirmed" value="yes">Delete task</button>
  <a href="{{ url_for('tasks.list_tasks') }}">Cancel</a>
  </div>
</form>
</section>
{% endblock %}
